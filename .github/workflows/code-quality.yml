name: Code Quality and Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting (required)
        run: npm run format:check
      - name: Run Biome lint and assist checks (required)
        run: npm run lint:biome
      - name: Run html-validate (advisory)
        run: npm run lint:html
        continue-on-error: true
      - name: Run Stylelint (advisory)
        run: npm run lint:css
        continue-on-error: true
      - name: Run ESLint (advisory)
        run: npm run lint:js
        continue-on-error: true
      - name: Verify tracked files are unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD --
