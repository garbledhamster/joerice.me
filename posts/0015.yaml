content: |
  I built [Privian Care Management](https://priviancare.com/) for a friend's wife. I thought putting a website together would be a good way to help her get started.

  The site introduces the care services, explains the support available, and gives families a way to get in touch.

  ![The Privian Care Management homepage introduces the service and links visitors to service information and contact.](assets/images/projects/privian-overview-2026-10-12.jpg)

  *The Privian Care Management homepage introduces the service and links visitors to service information and contact. Captured October 12, 2026.*

  ### Understanding the services

  Families can read about the different care offerings and look through resources and answers to common questions. The site also includes service-area information for Minneapolis and the Twin Cities.

  ![Three service descriptions explain the support presented on the Privian website.](assets/images/projects/privian-services-2026-10-12.jpg)

  *Three service descriptions explain the support presented on the Privian website. Captured October 12, 2026.*

  ### Starting a conversation

  A visitor can use the contact information or form after reading about the services. The phone layout gives them the same information without needing a computer.

  ![The contact section on a phone-sized screen shows the message form, phone number, and email address.](assets/images/projects/privian-phone-2026-10-12.jpg)

  *The contact section on a phone-sized screen shows the message form, phone number, and email address. Captured October 12, 2026.*

  This was a chance to help someone I knew put her work online. [Visit Privian Care Management](https://priviancare.com/) to see it, or [tell me about the website you have in mind](#contact).
