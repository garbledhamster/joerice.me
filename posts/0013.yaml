content: |
  I built [J & D's Heritage Hog Farm](https://jdhogfarm.com/) for my parents in Mountain Grove, Missouri. I wanted a project where I could develop my website skills and do something useful for my family.

  In [my November 2024 post](https://buymeacoffee.com/garbledhamster/created-website-parents), I wrote about experimenting with responsive design and ways to present the farm online. This is a look at the site as it stands today.

  ### Getting to know the farm

  You can read about the farm and its pasture-raised hogs, look through photos, and learn what buying from the farm involves. Someone who hasn't bought a hog before can start with the buying information and FAQs to understand the options, reservations, and pickup.

  ![J & D's Heritage Hog Farm website shown in browser and phone mockups.](assets/images/projects/jdhogfarm-browser-phone-mockup-2026-10-17.jpg)

  *J & D's Heritage Hog Farm in browser and phone mockups. Created October 17, 2026.*

  ### Finding the next step

  The buying information sits alongside a way to contact the farm. A visitor can read first, then ask about what they need rather than having to know the right questions before arriving.

  ![The buying section explains hog options, reservations, payment, and pickup, with a link to contact the farm.](assets/images/projects/jdhogfarm-buying-2026-10-12.jpg)

  *The buying section explains hog options, reservations, payment, and pickup, with a link to contact the farm. Captured October 12, 2026.*

  This was one of my first websites for other people. Helping my parents put their farm online gave me something real to work on as I learned.

  You can [visit the farm site](https://jdhogfarm.com/) to look through it. If you need a website for your own work, [tell me what you're trying to accomplish](#contact) so we can talk about what would help.
