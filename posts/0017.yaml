content: |
  [Feelings and Needs](https://feelings.ourstuff.space/) is the project I'm working on now. I made The Manual for Feelings and Needs because I struggled, and still struggle, with identifying my own feelings and needs. I wanted a way to start with whatever word I had and explore what might be connected with it.

  Through my reading, I found ideas I wanted to bring together in a practical, teachable form. I use AI to help compile and organize that information, develop the writing, and create illustrations. I bring my experiences, questions, and direction to the process.

  ![The Feelings and Needs homepage introduces Joe's manual, the free companion guide, and the paperback and PDF bundle.](assets/images/projects/feelings-overview-2026-10-12.jpg)

  *The homepage introduces the manual and gives readers a way to try the free companion. Captured October 12, 2026.*

  ### Bringing the book and website together

  On the site, you can look through real pages from the manual, try a [free companion guide](https://feelings.ourstuff.space/b/BIeOg), or choose the complete book in paperback or PDF. I use Payhip for the shop and Lulu for printing and shipping, with Make handling the connection between them.

  I wanted someone visiting for the first time to have enough information to decide what would be useful. The [sample PDF](https://feelings.ourstuff.space/preview/htHOW) includes complete pages from the book, including a practical guide for turning a reaction into words.

  ![The look-inside section shows original manual pages 57 and 102, with feeling and need entries beside the Turn a reaction into words guide.](assets/images/projects/feelings-current-sample-2026-10-12.jpg)

  *Readers can inspect the original pages and open the sample PDF to read or zoom. Captured October 12, 2026.*

  ### Stories and practical examples

  I'm also developing Everyday Feelings and Needs, a series about a fictional family. They struggle to communicate, make mistakes, and sometimes understand each other better while still disagreeing. The personal notes draw on experiences I've shared.

  I'm working on the website and Facebook content together so readers can follow a story or practical example back to the relevant resource. This is an ongoing project, and I'm still developing the content and how I present it.

  You can [explore Feelings and Needs](https://feelings.ourstuff.space/) or [follow the project on Facebook](https://www.facebook.com/61594832228540/) for stories and practical examples.
