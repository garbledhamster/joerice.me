id: "0012"
title: "Helping People Learn the Tools They Need"
date: 2026-10-01
pinned: false
tags: ["training", "communication", "technology", "AI"]
content: |
  I enjoy the moment when someone understands enough to try a task for themselves. In support work, that might happen while we walk through a setting. In a training session, it might happen when someone practices with an example from their day.

  My experience includes explaining technical problems, mentoring, and developing introductory training and material for different audiences. I've also worked on AI orientation and adoption. I bring the technical background, but I need to understand the learner's starting point before deciding what to teach.

  I want to know what they need the tool for, what they already understand, and where they hesitate. Someone exploring a tool for the first time needs a different conversation from someone trying to incorporate it into a team's work.

  I like to connect an explanation to something the person can do. We can walk through an example, let them try it, and discuss what happened. Their questions help me see what needs a better explanation. With AI tools, that includes practicing how to review a response and recognize when more information or a human decision is needed.

  If you're teaching a coworker a task, choose one result they need to produce. Show the process, give them a chance to do it, and ask them to explain how they checked their work. You'll learn where they feel confident and where they need another example.

  I can help explain unfamiliar technology, develop practical learning material, and support people as they start using a new process. I want them to leave with a skill they can use and enough understanding to keep learning.
