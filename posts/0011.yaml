id: "0011"
title: "Writing Notes Someone Can Use Later"
date: 2026-10-01
pinned: false
tags: ["documentation", "knowledge", "notes", "learning"]
content: |
  I take notes because I want to use what I've learned again. That might mean returning to a technical issue next month, handing a project to a teammate, or finding an idea from a book after I've forgotten where I read it.

  In technical work, I use rapid logs to capture observations, events, and tasks while the work is happening. I then refine those notes into something another person can follow. A short observation may be enough during an investigation. A task needs enough detail that I can act on it later without reconstructing the conversation.

  I've written procedures, diagrams, and handoff documentation. I also use journals and linked notes in my own learning. Across those practices, I keep returning to a few questions: Who will read this? What will they need to do? What context will they be missing?

  A useful handoff explains the current state, the decisions already made, and the next action. A procedure gives someone a starting point and a way to check the result. For my own learning notes, I try to explain an idea in my words and keep a reference so I can return to the source.

  Try opening a note you wrote a few months ago. Can you tell what it means and what you intended to do with it? If you have to rely on memory, add the missing context. That small review can tell you more about your note system than adding another folder.

  I can help organize information, develop procedures, and build a note workflow around how someone works. I want the person using it to find an answer, understand the reasoning, and have a place to add what they learn next.
