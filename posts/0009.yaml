id: "0009"
title: "Giving Complicated Work a Clear Next Step"
date: 2026-10-01
pinned: false
tags: ["projects", "planning", "workflow", "collaboration"]
content: |
  I've found that planning gets harder when several different questions sit in the same conversation. What are we trying to accomplish? Who needs to make the decision? Are we ready to make the change? Who will support it afterward?

  In my project work, I developed a framework that separates those questions into stages: identification, management, discovery, planning, staging, execution, and closure. I use it to organize migrations and technical changes, and to make the work easier to explain to someone joining the project.

  Discovery gives me time to understand the current environment and talk with the people involved. Planning turns that information into tasks, dependencies, and decisions. Staging gives us a chance to prepare and test before the main change. At closure, I gather the handoff notes and review the result with the people who will use it.

  I apply the same thinking to workflows. I look at how a request arrives, who takes responsibility for it, where it waits, and how someone knows it is finished. Then I help turn that understanding into a process people can follow.

  For a project of your own, start with four things: the result you want, the person responsible for moving it forward, the next action, and how you'll know it worked. If you can't name one of those, you have a useful question to resolve before adding more tasks.

  I bring structure to work that involves several people or systems. I can help map the process, develop the plan, coordinate the technical work, and document the handoff. My aim is to give people enough clarity to act without carrying the whole project in their heads.
