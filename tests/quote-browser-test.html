<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quote browser tests</title>
  </head>
  <body>

    <button type="button" id="feedback">Send feedback or request an update</button>

    <dialog id="quoteSheet" aria-label="Hire me">

    <pre id="testResults" role="status">Running quote browser tests…</pre>
    <script type="module" src="quote-browser-test.js"></script>
  </body>
</html>
