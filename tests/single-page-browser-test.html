<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="../">
    <title>Single-page browser test</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=Bebas+Neue&amp;family=Fira+Code&amp;display=swap" rel="stylesheet">
    <style>
      #testResults {
        position: fixed;
        z-index: 9999;
        right: 12px;
        bottom: 12px;
        max-width: min(520px, calc(100vw - 24px));
        max-height: 45vh;
        overflow: auto;
        padding: 16px;
        border: 2px solid currentColor;
        color: #111;
        background: #fff;
        font: 13px/1.5 monospace;
        white-space: pre-wrap;
      }

      body[data-test-status="passed"] #testResults {
        color: #064b23;
        background: #dff8e8;
      }

      body[data-test-status="failed"] #testResults {
        color: #791515;
        background: #ffe4e4;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <pre id="testResults" role="status">Running single-page browser tests…</pre>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script>
      const testPost = {
        title: "Editable test post",
        body: "This post exists so the browser test can exercise the real inline editor.",
        createdDate: "2026-01-01T00:00:00.000Z",
        published: true,
        pinned: false,
        serviceIds: ["web-site"],
      };
	  const secondTestPost = {
		title: "Second editable post",
		body: "A second post makes stale inline-editor submissions observable.",
		createdDate: "2026-01-02T00:00:00.000Z",
		published: true,
		pinned: false,
	  };
	  const testPosts = {
		"editable-test-post": testPost,
		"second-editable-test-post": secondTestPost,
		"draft-related-post": { ...testPost, title: "Private draft", published: false },
	  };
	  window.testWrittenPostId = null;
      let testPostDeleted = false;
      const testServices = {};
      window.testFailWrites = false;
      window.testFailPostReads = false;

      const emptySnapshot = {
        docs: [],
        empty: true,
        forEach() {},
      };
      const postSnapshot = {
        get docs() {
          return testPostDeleted
            ? []
            : Object.entries(testPosts).map(([id, post]) => ({
				id,
				data: () => ({ ...post }),
			  }));
        },
        get empty() {
          return testPostDeleted;
        },
        forEach(callback) {
          this.docs.forEach(callback);
        },
      };
      const makeCollection = (name) => {
        const records = name === "Services" ? testServices : testPosts;
        const collection = {
          where(field, op, value) {
            return {
              async get() {
                if (window.testFailPostReads && name === "Posts") throw new Error("Test read failure");
                return {
                  forEach(callback) {
                    Object.entries(records).filter(([, data]) => data[field] === value).forEach(([id, data]) => callback({ id, data: () => ({ ...data }) }));
                  }
                };
              }
            };
          },
          orderBy() {
            return collection;
          },
          async get() {
            if (window.testFailPostReads && name === "Posts") throw new Error("Test read failure");
            return name === "Posts" ? postSnapshot : name === "Services" ? { forEach(callback) { Object.entries(testServices).forEach(([id, data]) => callback({ id, data: () => ({ ...data }) })); } } : emptySnapshot;
          },
          doc(id = "new-test-post") {
            return {
              id,
              collectionName: name,
              async get() {
                return {
				  exists: !testPostDeleted && Boolean(records[id]),
				  data: () => ({ ...records[id] }),
                };
              },
              async set(data) {
				if (window.testFailWrites) throw new Error("Test permission denied");
				window.testWrittenPostId = id;
				records[id] = { ...records[id], ...data };
              },
              async delete() {
                testPostDeleted = true;
              },
            };
          },
          async add() {
            return { id: "new-test-item" };
          },
        };
        return collection;
      };
      const testFirestore = { collection: makeCollection, batch() {
        const writes = [];
        return { set(ref, data) { writes.push([ref, data]); }, async commit() {
          if (window.testFailWrites) throw new Error("Test permission denied");
          for (const [ref, data] of writes) await ref.set(data);
        } };
      } };
      const testAuth = {
        isSignInWithEmailLink: () => false,
        onAuthStateChanged(callback) {
          queueMicrotask(() => callback({ email: "jmjrice94@gmail.com", uid: "browser-test-admin" }));
        },
      };
      const firebaseAuth = () => testAuth;
      const firebaseFirestore = () => testFirestore;
      firebaseFirestore.FieldValue = { serverTimestamp: () => "2026-01-01T00:00:00.000Z" };
      window.firebaseConfig = {
        apiKey: "test",
        authDomain: "test.example.com",
        projectId: "test",
        storageBucket: "test",
        messagingSenderId: "test",
        appId: "test",
      };
      window.firebase = {
        apps: [],
        initializeApp(config) {
          const app = { config };
          this.apps.push(app);
          return app;
        },
        auth: firebaseAuth,
        firestore: firebaseFirestore,
        storage: () => ({}),
      };

      const nativeFetch = window.fetch.bind(window);
      window.testQuoteRequests = [];
      window.testFailQuoteRequest = false;
      window.fetch = (input, init) => {
        const requestUrl = String(input);
        if (requestUrl === "https://formspree.io/f/xovqpvdv") {
          window.testQuoteRequests.push([...init.body.entries()]);
          return Promise.resolve(new Response("{}", { status: window.testFailQuoteRequest ? 500 : 200 }));
        }
        const response = nativeFetch(input, init);
        const requestPath = new URL(requestUrl, document.baseURI).pathname;
        if (requestPath.endsWith("posts/0002.yaml")) {
          return response.then(async (original) => {
            const post = jsyaml.load(await original.text());
            post.serviceIds = ["web-site"];
            return new Response(jsyaml.dump(post), { status: original.status, headers: original.headers });
          });
        }
        if (!requestPath.endsWith("posts/0001.yaml")) return response;

        return new Promise((resolve, reject) => {
          setTimeout(() => response.then(resolve, reject), 300);
        });
      };

      window.testScrollTargets = [];
      if (!new URLSearchParams(location.search).has("manual")) {
      Element.prototype.scrollIntoView = function scrollIntoView() {
        window.testScrollTargets.push(
          this.querySelector?.(".postTitleButton")?.dataset.url || this.id || "unknown",
        );
      };
      }

      document.addEventListener(
        "click",
        (event) => {
          if (event.target.closest?.("#mainNav [data-section]")) event.preventDefault();
        },
        true,
      );
    </script>
    <script type="module" src="assets/js/main.js"></script>
    <script type="module">
      if (!new URLSearchParams(location.search).has("manual")) {
      const results = document.getElementById("testResults");
      const failures = [];

      function assert(condition, message) {
        if (!condition) failures.push(message);
      }

      async function waitFor(check, timeout = 5000) {
        const started = performance.now();
        while (performance.now() - started < timeout) {
          const value = check();
          if (value) return value;
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
        return null;
      }

      await waitFor(() => document.body.classList.contains("loaded"));


      // The gallery must change examples without changing its viewing geometry.
      const productsSection = document.getElementById("productsSection");
      const productPicker = document.getElementById("productProjectPicker");
      assert(Boolean(productPicker), "Books and tools should offer one project picker instead of four expanded galleries");
      if (productPicker) {
        await document.fonts.ready;
        const viewport = productsSection.querySelector(".productGalleryViewport");
        const frame = viewport.getBoundingClientRect();
        const height = productsSection.getBoundingClientRect().height;
        const frameOffset = frame.top - productsSection.getBoundingClientRect().top;
        const pickProject = (value) => {
          productPicker.value = value;
          productPicker.dispatchEvent(new Event("change", { bubbles: true }));
        };
        const shownThumb = (index) => [...productsSection.querySelectorAll('[data-product-shot]')].find(button => button.dataset.productShot === String(index) && !button.closest("[inert]"));
        assert(productPicker.options.length === 4, "the picker should retain all four existing projects");
        shownThumb(2).click();
        assert(productsSection.querySelector(".productMainImage").src.includes("feelings-stories-index"), "choosing a thumbnail should display its actual example");
        assert(shownThumb(2).getAttribute("aria-pressed") === "true", "the selected thumbnail should announce its selection");
        productsSection.querySelector('[data-product-direction="1"]').focus();
        productsSection.querySelector('[data-product-direction="1"]').click();
        assert(document.activeElement?.dataset.productDirection === "1", "next should keep keyboard focus on its control");
        productsSection.querySelector('[data-product-direction="1"]').click();
        assert(productsSection.querySelector(".productMainImage").src.includes("feelings-home"), "next should wrap from the last example to the first");
        productsSection.querySelector('[data-product-direction="-1"]').click();
        assert(productsSection.querySelector(".productMainImage").src.includes("feelings-book-formats"), "previous should wrap back to the last example");
        pickProject("3");
        shownThumb(2).click();
        assert(productsSection.querySelector(".productMainImage").src.includes("fasttrack-meal-entry"), "portrait examples should remain available");
        assert(productsSection.querySelector(".productMainImage").alt.includes("meal"), "the main image should carry the chosen example's alternative text");
        pickProject("0");
        assert(productsSection.querySelector(".productMainImage").src.includes("feelings-book-formats"), "returning to a project should restore its last example");
        pickProject("3");
        assert(productsSection.querySelector(".productMainImage").src.includes("fasttrack-meal-entry"), "projects should remember their examples independently");
        const fullSize = productsSection.querySelector(".productGalleryViewport");
        assert(fullSize.getAttribute("href").includes("fasttrack-meal-entry") && fullSize.target === "_blank", "full-size access should track the selected image");
        assert([...productsSection.querySelectorAll(".productDetailsPanel")].filter(panel => !panel.inert).length === 1, "only the selected project's details should be interactive");
        for (let project = 0; project < 4; project += 1) {
          pickProject(String(project));
          for (let shot = 0; shot < 4; shot += 1) {
            shownThumb(shot).click();
            const current = viewport.getBoundingClientRect();
            assert(Math.abs(current.width-frame.width) < 1 && Math.abs(current.height-frame.height) < 1 && Math.abs(current.top-productsSection.getBoundingClientRect().top-frameOffset) < 1, "project and example changes should keep the same viewing frame");
            assert(Math.abs(productsSection.getBoundingClientRect().height-height) < 1, "captions and details should not resize the section");
          }
        }
        pickProject("0");
        shownThumb(0).click();
        shownThumb(1).focus({ preventScroll: true });
        shownThumb(1).dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
        assert(productsSection.querySelector(".productMainImage").src.includes("feelings-stories-index"), "thumbnail arrow keys should move from the focused example, even when it was not selected");
        const { initProducts, destroyProducts } = await import("./assets/js/pages/products.js");
        destroyProducts();
        initProducts();
        initProducts();
        pickProject("0");
        shownThumb(0).click();
        productsSection.querySelector('[data-product-direction="1"]').click();
        assert(productsSection.querySelector(".productMainImage").src.includes("feelings-sample"), "reinitializing should not duplicate gallery controls");
        const activeImage = productsSection.querySelector(".productMainImage");
        activeImage.dispatchEvent(new Event("error"));
        assert(!productsSection.querySelector(".productImageStatus").hidden && productsSection.querySelector(".productImageStatus").textContent.includes("could not load"), "an unavailable screenshot should give recovery guidance inside the same frame");
        shownThumb(2).click();
        activeImage.dispatchEvent(new Event("error"));
        assert(!productsSection.querySelector(".productImageStatus").textContent.includes("could not load"), "a stale image error must not overwrite the new example's state");
        pickProject("0");
        shownThumb(0).click();
      }

      // Exercise quote submission with only the external delivery boundary replaced.
      const quoteForm = document.getElementById("contactForm");
      const phoneField = quoteForm.elements.phone;
      assert(phoneField?.type === "tel" && !phoneField.required, "quote requests should accept an optional phone number");
      quoteForm.elements.name.value = "Quote test";
      quoteForm.elements.email.value = "quote@example.com";
      quoteForm.elements.message.value = "I need help getting my project online.";
      if (phoneField) phoneField.value = "555-0100";
      const { selectService } = await import("./assets/js/services/catalog.js");
      selectService("web-site", true);
      selectService("ai-coaching", true);
      assert(quoteForm.checkValidity(), "one message should be enough to request a quote for multiple services");
      window.testFailQuoteRequest = true;
      const nativeAlert = window.alert;
      window.alert = () => {};
      quoteForm.requestSubmit();
      await waitFor(() => window.testQuoteRequests.length, 1000);
      if (window.testQuoteRequests.length) {
        await waitFor(() => !quoteForm.querySelector('[type="submit"]').disabled);
        assert(quoteForm.elements.message.value.includes("project online"), "failed quote requests should preserve the message");
        assert(phoneField?.value === "555-0100", "failed quote requests should preserve the phone number");
        assert(document.querySelectorAll('#selectedServices [name="services"]').length === 2, "failed quote requests should preserve service selections");
        window.testFailQuoteRequest = false;
        quoteForm.requestSubmit();
        await waitFor(() => document.getElementById("contactModal").classList.contains("show"));
        const sent = window.testQuoteRequests.at(-1);
        assert(sent.some(([key, value]) => key === "phone" && value === "555-0100"), "quote delivery should include the supplied phone number");
        assert(sent.filter(([key]) => key === "services").length === 2, "quote delivery should include every selected service");
        assert(quoteForm.elements.message.value === "" && document.getElementById("serviceSelectionBanner").hidden, "successful delivery should clear the form and shared selections");
        document.getElementById("closeContactModal").click();
        quoteForm.elements.name.value = "Unsure test";
        quoteForm.elements.email.value = "unsure@example.com";
        quoteForm.elements.message.value = "I'm not sure which service fits.";
        assert(quoteForm.checkValidity(), "quote requests should work without a phone number or service selection");
        quoteForm.requestSubmit();
        await waitFor(() => document.getElementById("contactModal").classList.contains("show"));
        assert(!window.testQuoteRequests.at(-1).some(([key]) => key === "services"), "unsure visitors should be able to submit without selected services");
        document.getElementById("closeContactModal").click();
      }
      window.alert = nativeAlert;
      const { clearSelectedServices } = await import("./assets/js/services/catalog.js");
      clearSelectedServices();
      quoteForm.reset();

      const expectedAnchors = [
        "#about",
        "#services",
        "#portfolio",
        "#contact",
        "#gallery",
        "#quotes",
        "#links",
      ];
      const navHrefs = [...document.querySelectorAll("#mainNav a[data-section]")].map(
        (link) => link.getAttribute("href"),
      );

      assert(
        JSON.stringify(navHrefs) === JSON.stringify(expectedAnchors),
        `sticky navigation should expose ${expectedAnchors.join(", ")}`,
      );

      expectedAnchors.forEach((anchor) => {
        assert(document.querySelector(anchor), `${anchor} should render on the initial page`);
      });

      const firstService = document.querySelector(".serviceCard");
      const serviceTitle = firstService?.querySelector(".serviceCardFront h4")?.textContent.trim();
      const backTitle = firstService?.querySelector(".serviceCardBack h4")?.textContent.trim();
      const serviceSelect = firstService?.querySelector(".serviceSelect");
      assert(backTitle === serviceTitle, "the back of a service card should repeat that service's title");
      assert(serviceSelect, "a flipped service card should offer a selection checkbox");
      assert(
        getComputedStyle(serviceSelect).visibility === "hidden",
        "service selection should stay out of keyboard navigation until the card is flipped",
      );

      firstService?.querySelector(".serviceCardFlip")?.click();
      if (serviceSelect) {
        assert(
          getComputedStyle(serviceSelect).visibility === "visible",
          "flipping a service card should reveal its selection checkbox",
        );
        serviceSelect.click();
        const attachment = await waitFor(() => document.querySelector(".selectedServiceAttachment"));
        assert(!document.getElementById("serviceSelectionBanner").hidden, "selecting a service should show the bottom banner");
        assert(document.getElementById("serviceSelectionCount").textContent === "1 service selected", "banner should show the selected count");
        document.getElementById("jumpToContact").click();
        assert(document.activeElement?.name === "name", "contact jump should focus the contact form");
        assert(window.testScrollTargets.includes("contactSection"), "contact jump should scroll to the form");
        const messageField = document.querySelector('#contactForm textarea[name="message"]');
        const attachments = document.getElementById("selectedServices");
        assert(firstService.classList.contains("is-flipped"), "checking a service should leave its card flipped");
        assert(attachment?.textContent.includes(serviceTitle), "the selected service should attach to the contact form");
        assert(
          messageField && attachments && messageField.compareDocumentPosition(attachments) & Node.DOCUMENT_POSITION_FOLLOWING,
          "selected services should appear below the contact message field",
        );
        assert(
          !attachment?.querySelector("textarea"),
          "selected services should attach without requiring duplicate project descriptions",
        );
        document.querySelector('.contactServiceSelect[value="ai-coaching"]').click();
        assert(document.querySelector('.serviceSelect[value="ai-coaching"]').checked, "form service choices should sync with the service cards");
        document.querySelector('.contactServiceSelect[value="ai-coaching"]').click();

        serviceSelect.click();
        assert(document.getElementById("serviceSelectionBanner").hidden, "clearing services should hide the banner");
        assert(
          !document.querySelector(".selectedServiceAttachment"),
          "unchecking a service should remove its contact attachment",
        );
      }

      await waitFor(() => document.getElementById("portfolioStatus").hidden);
      const postSearch = document.getElementById("q");
      const topicFilter = document.getElementById("postTopicFilter");
      const typeFilter = document.getElementById("postTypeFilter");
      const postPagination = document.getElementById("postPagination");
      const postResultsCount = document.getElementById("postResultsCount");
      const postEmptyState = document.getElementById("postEmptyState");
      const postButton = (url) => [...document.querySelectorAll(".postTitleButton")].find(button => button.dataset.url === url);
      const pagePostUrls = () => [...document.querySelectorAll("#entryGrid .postTitleButton")].map(button => button.dataset.url);
      const currentPostPage = () => Number(document.querySelector('#postPagination [aria-current="page"]')?.dataset.page || 1);
      const openPost = async (url) => {
        window.dispatchEvent(new CustomEvent("open-related-post", { detail: { url } }));
        return waitFor(() => {
          const button = postButton(url);
          return button?.getAttribute("aria-expanded") === "true" ? button : null;
        });
      };
      const setPostSearch = (value) => {
        postSearch.value = value;
        postSearch.dispatchEvent(new Event("input", { bubbles: true }));
      };
      const setPostFilter = (filter, value) => {
        filter.value = value;
        filter.dispatchEvent(new Event("change", { bubbles: true }));
      };
      const loader = jsyaml.load(await (await fetch("posts/loader.yaml")).text());
      const bundledPosts = await Promise.all(loader.posts.map(async (url) => ({
        ...jsyaml.load(await (await fetch(url)).text()), url,
      })));
      const allTestPosts = [...bundledPosts, ...Object.entries(testPosts).map(([id, post]) => ({ ...post, url: `firestore:${id}` }))];
      const unpinnedPosts = allTestPosts.filter(post => !post.pinned);

      assert(!document.querySelector(".websiteWork"), "website projects should appear with the other posts instead of in a second list");
      assert(topicFilter && typeFilter, "posts should offer service/topic and post-type filters");
      assert(postPagination?.tagName === "NAV", "pagination should expose a navigation landmark");
      assert(postResultsCount?.getAttribute("aria-live") === "polite", "updated result counts should be announced without interrupting readers");
      assert(postEmptyState, "posts should provide a recoverable empty state");
      const firstPageUrls = pagePostUrls();
      assert(firstPageUrls.length === 6, "the initial page should display six unpinned posts");
      assert(document.querySelector('#pinnedGrid [data-url="posts/0001.yaml"]'), "pinned posts should stay separate from the six-post page");
      assert(firstPageUrls.every(url => !bundledPosts.find(post => post.url === url)?.pinned), "pinned posts should not also appear in the paginated list");
      assert(firstPageUrls.every(url => postButton(url)?.querySelector(".postLabels")), "each post title should identify its type and services or topics");
      assert(postResultsCount?.textContent.includes(`of ${unpinnedPosts.length} posts`), "the result count should include all posts across every page");
      assert(document.querySelector('#postPagination [data-page="1"]')?.getAttribute("aria-current") === "page", "the first page should identify the current page accessibly");

      const pageTwoButton = document.querySelector('#postPagination [data-page="2"]');
      assert(pageTwoButton, "more than six posts should offer a second page");
      if (pageTwoButton && topicFilter && typeFilter && postEmptyState) {
        pageTwoButton.click();
        await waitFor(() => currentPostPage() === 2);
        const secondPageUrls = pagePostUrls();
        assert(secondPageUrls.length > 0 && secondPageUrls.length <= 6, "moving pages should keep the list within six posts");
        assert(secondPageUrls.every(url => !firstPageUrls.includes(url)), "the second page should show different posts without duplicates");
        assert(document.querySelector('#pinnedGrid [data-url="posts/0001.yaml"]'), "moving pages should retain the separate pinned section");
        assert(postResultsCount.textContent.includes(`of ${unpinnedPosts.length} posts`), "moving pages should preserve the total result count");

        document.querySelector('#postPagination [data-page="1"]').click();
        const offPagePost = allTestPosts.find(post => post.url === secondPageUrls[0]);
        assert(offPagePost && !postButton(offPagePost.url), "the search fixture should start outside the current page");
        if (offPagePost) {
          setPostSearch(offPagePost.title);
          await waitFor(() => postButton(offPagePost.url));
          assert(postButton(offPagePost.url), "search should find matching posts on other pages");
          assert(currentPostPage() === 1, "search changes should start at the first result page");
          assert(pagePostUrls().length === 1 && postResultsCount.textContent.includes("of 1 posts"), "search should paginate and count only matching posts");
        }
        setPostSearch("no-post-can-match-this-unique-query");
        assert(pagePostUrls().length === 0 && !postEmptyState.hidden, "unmatched searches should show an empty state");
        assert(document.querySelectorAll("#pinnedGrid .postTitleButton").length === 0, "search should filter pinned posts as well");
        setPostSearch("");
        assert(postEmptyState.hidden && pagePostUrls().length === 6, "clearing search should recover the first page");

        const assertFilteredPosts = (expected, label) => {
          const rendered = pagePostUrls();
          assert(rendered.length === Math.min(6, expected.filter(post => !post.pinned).length), `${label} should respect the page size`);
          assert(rendered.every(url => expected.some(post => post.url === url)), `${label} should show only matching posts`);
          assert(postResultsCount.textContent.includes(`of ${expected.filter(post => !post.pinned).length} posts`), `${label} should count matches across the full collection`);
        };
        document.querySelector('#postPagination [data-page="2"]').click();
        assert([...topicFilter.options].some(option => option.value === "service:web-site"), "topic choices should include related services");
        setPostFilter(topicFilter, "service:web-site");
        assert(currentPostPage() === 1, "changing the service/topic filter should return to the first page");
        assertFilteredPosts(allTestPosts.filter(post => post.serviceIds?.includes("web-site")), "service filtering");
        assert(pagePostUrls().every(url => postButton(url)?.querySelector(".postLabels")?.textContent.includes("Web Site")), "service-related posts should show the service name beside their titles");
        setPostFilter(topicFilter, "all");
        document.querySelector('#postPagination [data-page="2"]').click();
        assert([...topicFilter.options].some(option => option.value === "topic:website"), "topic choices should include the website topic");
        setPostFilter(topicFilter, "topic:website");
        assert(currentPostPage() === 1, "changing a topic should return to the first page");
        assertFilteredPosts(allTestPosts.filter(post => post.tags?.includes("website")), "topic filtering");
        setPostFilter(topicFilter, "all");
        document.querySelector('#postPagination [data-page="2"]').click();
        setPostFilter(typeFilter, "project");
        assert(currentPostPage() === 1, "changing the post type should return to the first page");
        assertFilteredPosts(allTestPosts.filter(post => (post.postType || "article") === "project"), "post-type filtering");
        assert(pagePostUrls().length > 0, "the project type should include published website projects");
        assert(pagePostUrls().every(url => postButton(url)?.querySelector(".postLabels")?.textContent.toLowerCase().includes("project")), "project posts should identify their post type beside the title");
        setPostFilter(typeFilter, "article");
        assertFilteredPosts(allTestPosts.filter(post => (post.postType || "article") === "article"), "article filtering");
        setPostFilter(topicFilter, "topic:website");
        const combinedMatches = allTestPosts.filter(post => (post.postType || "article") === "article" && post.tags?.includes("website"));
        assertFilteredPosts(combinedMatches, "combined type and topic filtering");
        assert(postEmptyState.hidden === Boolean(combinedMatches.length), "combined filters should display an empty state only when nothing matches");
        setPostFilter(topicFilter, "all");
        setPostFilter(typeFilter, "all");
      }
      let editablePost = await openPost("firestore:editable-test-post");
      let editableRow = editablePost?.closest(".postAccordion");
      const relatedCard = document.querySelector('.serviceCard[data-service="Web Site"]');
      const relatedButton = relatedCard?.querySelector('.servicePostsToggle');
      assert(relatedButton, "flipped services should offer related posts");
      relatedButton?.click();
      const relatedLinks = [...(relatedCard?.querySelectorAll('.servicePostLink') || [])];
      const bundledRelatedLink = relatedLinks.find(link => link.dataset.postUrl === "posts/0002.yaml");
      assert(relatedLinks.some(link => link.textContent === "Editable test post") && bundledRelatedLink, "related lists should include tagged Firebase and bundled posts");
      assert(!relatedLinks.some(link => link.textContent === "Private draft" || link.dataset.postUrl === "posts/0003.yaml"), "related lists should exclude private and untagged posts");
      assert(relatedCard?.querySelector('.serviceToggle').checked, "related posts must not unflip the service card");
      setPostSearch("no-post-can-match-this-unique-query");
      if (typeFilter && topicFilter) {
        setPostFilter(typeFilter, "project");
        setPostFilter(topicFilter, "topic:website");
      }
      assert(!postButton("posts/0002.yaml"), "the related-post fixture should start outside the filtered list");
      bundledRelatedLink?.click();
      const bundledTitle = await waitFor(() => {
        const button = postButton("posts/0002.yaml");
        return button?.getAttribute("aria-expanded") === "true" ? button : null;
      });
      assert(bundledTitle, "service-related links should navigate to and open a post outside the current page");
      assert(postSearch.value === "" && typeFilter?.value === "all" && topicFilter?.value === "all", "service-related links should clear filters that hide the requested post");
      assert(bundledTitle?.closest('.postAccordion').querySelector('.relatedServiceSelect[value="web-site"]'), "bundled post readers should offer their tagged service");
      relatedLinks.find(link => link.textContent === "Editable test post")?.click();
      editablePost = await waitFor(() => {
        const button = postButton("firestore:editable-test-post");
        return button?.getAttribute("aria-expanded") === "true" ? button : null;
      });
      editableRow = editablePost?.closest(".postAccordion");
      assert(editableRow?.classList.contains('is-open'), "related titles should open the matching inline reader");
      relatedCard?.querySelector('.serviceDetailsButton')?.click();
      assert(!relatedCard?.classList.contains('show-related-posts'), "back to details should restore service highlights");
      assert(relatedCard?.querySelector('.serviceDetailsButton')?.getAttribute('aria-pressed') === 'true', "the card should clearly identify its active detail view");
      relatedCard?.querySelector('.serviceDetails')?.click();
      assert(relatedCard?.querySelector('.serviceToggle').checked, "reading card details should not accidentally flip the card");
      relatedCard?.querySelector('.serviceCloseButton')?.click();
      assert(!relatedCard?.querySelector('.serviceToggle').checked, "Close should explicitly return to the card front");
      relatedCard?.querySelector('.serviceOpenButton')?.click();
      assert(relatedCard?.querySelector('.serviceToggle').checked, "View details should reopen the card");
      const emptyCard = document.querySelector('.serviceCard[data-service="Logo Design"]');
      emptyCard.querySelector('.serviceCardFlip').click();
      emptyCard.querySelector('.servicePostsToggle')?.click();
      assert(emptyCard.querySelector('.servicePosts')?.textContent.includes("No published posts"), "services without tagged posts should explain the empty list");
      emptyCard.querySelector('.serviceCloseButton')?.click();
      assert(emptyCard.querySelector('.serviceCardBack').inert, "unflipped related controls should not be keyboard accessible");
      assert(
        editableRow?.querySelector(".postTitleEditButton") && editableRow?.querySelector(".postTitleDeleteButton"),
        "editable posts should expose title-level edit and delete controls to the admin",
      );

      editableRow?.querySelector(".postTitleEditButton")?.click();
      const inlineEditor = await waitFor(() => editableRow?.querySelector(".postInlineEditor"));
      assert(inlineEditor, "editing a post should open an editor inside that post's accordion");
      assert(
        !document.getElementById("portfolioModal")?.classList.contains("show"),
        "editing an existing post should not open the portfolio modal",
      );
      assert(
        inlineEditor?.querySelector('input[name="title"]')?.value === "Editable test post",
        "the inline editor should preload the post title",
      );
      const { saveService } = await import("./assets/js/services/catalog.js");
      await saveService("test-new-service", { title: "New service", description: "New offering", highlights: [], available: true });
      assert(inlineEditor?.querySelector('[name="serviceIds"][value="test-new-service"]'), "an open post editor should offer newly available services");
      assert(inlineEditor?.querySelector('[name="serviceIds"][value="web-site"]')?.checked, "refreshing service choices must preserve checked tags");
      window.testWrittenPostId = null;

	  const staleEditor = inlineEditor;
	  const secondEditablePost = await openPost("firestore:second-editable-test-post");
	  secondEditablePost?.closest(".postAccordion")?.querySelector(".postTitleEditButton")?.click();
	  await waitFor(() =>
		secondEditablePost?.closest(".postAccordion")?.querySelector(".postInlineEditor"),
	  );
	  staleEditor?.requestSubmit();
	  await new Promise((resolve) => setTimeout(resolve, 50));
	  assert(
		window.testWrittenPostId === null,
		"a stale inline editor should not save over the currently open post",
	  );

	  const firstPost = await openPost("posts/0008.yaml");
	  assert(firstPost, "portfolio should render post titles as expandable buttons");

      if (firstPost) {
        firstPost.click();
        firstPost.click();
        const openPost = await waitFor(() => {
          const body = firstPost.closest(".postAccordion").querySelector(".postInlineBody");
          return body?.textContent.trim().length > 40 ? body : null;
        });
        assert(firstPost.getAttribute("aria-expanded") === "true", "clicked post title should become expanded");
        assert(openPost?.textContent.trim().length > 40, "expanded post reader should contain the post body");
      }

      await openPost("posts/0002.yaml");
      const delayedPost = postButton("posts/0001.yaml");
      const fasterPost = postButton("posts/0002.yaml");

      if (delayedPost && fasterPost) {
        delayedPost.closest(".postAccordion")?.classList.contains("is-open") && delayedPost.click();
        await new Promise((resolve) => setTimeout(resolve, 300));
        window.testScrollTargets.length = 0;

        delayedPost.click();
        fasterPost.click();
        await new Promise((resolve) => setTimeout(resolve, 650));

        assert(delayedPost.getAttribute("aria-expanded") === "false", "switching posts should close the older reader");
        assert(fasterPost.getAttribute("aria-expanded") === "true", "switching posts should keep the newest reader open");
        assert(
          JSON.stringify(window.testScrollTargets) === JSON.stringify(["posts/0002.yaml"]),
          "a stale post request should not scroll after a newer post opens",
        );
      } else {
        assert(false, "race-condition fixtures should be available");
      }

      const linksNav = document.querySelector('#mainNav [data-section="links"]');
      linksNav?.click();
      await new Promise((resolve) => setTimeout(resolve, 50));
      assert(linksNav?.getAttribute("aria-current") === "true", "clicking Links should activate the final nav item");

      const aboutCopy = document.getElementById("about")?.textContent.toLowerCase() || "";
      assert(aboutCopy.includes("systems generalist"), "About section should explain Joe's professional contribution");
      assert(aboutCopy.includes("help themselves"), "About section should explain the self-service purpose");

      assert(!bundledPosts.some(post => post.url === "posts/0007.yaml"), "the retired resume must not appear in the portfolio source list");
      for (let number = 8; number <= 12; number++) {
        const url = `posts/${String(number).padStart(4, "0")}.yaml`;
        const button = await openPost(url);
        assert(button, `professional article ${url} should be reachable across pages`);
        if (!button) continue;
        const article = button.closest(".postAccordion");
        await waitFor(() => article.classList.contains("is-open"));
        const body = article.querySelector(".postInlineBody").textContent;
        assert(body.length > 500 && !body.includes("Unable to load"), `professional article ${url} should open with its complete content`);
      }

      const projectSites = [
        ["posts/0013.yaml", "https://jdhogfarm.com/"],
        ["posts/0014.yaml", "https://spinners.pizza/"],
        ["posts/0015.yaml", "https://priviancare.com/"],
        ["posts/0017.yaml", "https://feelings.ourstuff.space/"],
      ];
      for (const [url, websiteUrl] of projectSites) {
        const title = await openPost(url);
        title?.click();
        const siteLink = title?.closest(".postAccordion").querySelector("a.postSiteLink");
        assert(title?.getAttribute("aria-expanded") === "false" && siteLink?.href === websiteUrl, `${url} should offer its website directly while the post is collapsed`);
        assert(siteLink && !title.contains(siteLink) && !siteLink.closest("button"), `${url} should keep its website link separate from the expandable title`);
        assert(siteLink?.target === "_blank" && siteLink.relList.contains("noopener") && siteLink.relList.contains("noreferrer"), `${url} should safely open its website in a new tab`);
        const target = siteLink?.getBoundingClientRect();
        assert(siteLink?.tabIndex >= 0 && getComputedStyle(siteLink).visibility === "visible" && target?.height >= 44 && target?.width >= 44, `${url} should provide a visible keyboard-accessible website link with a usable touch target`);
        title?.click();
        await waitFor(() => title?.getAttribute("aria-expanded") === "true");
        assert(title?.getAttribute("aria-expanded") === "true", `${url} should still open its post from the title`);
      }

      // Migrating an actual project must retain the metadata used to find it.
      const feelingsSource = bundledPosts.find(post => post.url === "posts/0017.yaml");
      const feelingsPost = (await openPost("posts/0017.yaml"))?.closest(".postAccordion");
      feelingsPost?.querySelector(".postTitleEditButton")?.click();
      const feelingsEditor = await waitFor(() => feelingsPost?.querySelector(".postInlineEditor"));
      assert(feelingsSource && feelingsEditor, "the current Feelings and Needs project should offer a real bundled-post editor");
      if (feelingsSource && feelingsEditor) {
        feelingsEditor.elements.body.value += "\n\nBrowser regression save.";
        feelingsEditor.requestSubmit();
        const savedFeelings = await waitFor(() => testPosts["imported-0017"]);
        await waitFor(() => !feelingsEditor.isConnected);
        assert(savedFeelings?.postType === feelingsSource.postType, "editing a bundled project should preserve its Project type in Firebase");
        assert(savedFeelings?.productName === feelingsSource.productName, "editing a bundled project should preserve its product name in Firebase");
        assert(JSON.stringify(savedFeelings?.tags) === JSON.stringify(feelingsSource.tags), "editing a bundled project should preserve its topic tags in Firebase");
        assert(savedFeelings?.websiteUrl && savedFeelings.websiteUrl === feelingsSource.websiteUrl, "editing a bundled project should preserve its direct website URL in Firebase");
        setPostFilter(typeFilter, "project");
        const migratedProject = postButton("firestore:imported-0017");
        assert(migratedProject, "the migrated Feelings and Needs post should remain in the Project filter");
        assert(migratedProject?.querySelector(".postLabels")?.textContent.includes("Feelings and Needs"), "the migrated project should still show its Feelings and Needs product label");
        assert(migratedProject?.closest(".postAccordion").querySelector("a.postSiteLink")?.href === "https://feelings.ourstuff.space/", "the Firebase replacement should keep its direct website link");
        setPostFilter(typeFilter, "all");
        setPostSearch("current-project");
        assert(postButton("firestore:imported-0017"), "tag searches should find the Firebase replacement after a project is edited");
        assert(!postButton("posts/0017.yaml"), "the edited project should replace its bundled original");
        setPostSearch("");
      }

      // Exercise actual editor forms with only the Firebase boundary replaced.
      setPostSearch("Custom websites");
      assert(pagePostUrls().length === 0 && !postEmptyState.hidden, "a future service name should initially have no search matches");
      document.querySelector('.serviceEditButton[data-service-id="web-site"]').click();
      const serviceEditor = document.querySelector(".serviceEditor");
      serviceEditor.elements.title.value = "Custom websites";
      serviceEditor.requestSubmit();
      await waitFor(() => !serviceEditor.isConnected);
      assert(testPosts["service-web-site"]?.title === "Custom websites", "service edits should persist as Firebase service records");
      assert(document.querySelector('.serviceCard[data-service="Custom websites"]'), "saved services should refresh their cards");
      assert(postSearch.value === "Custom websites" && pagePostUrls().length > 0 && postEmptyState.hidden, "renaming a service should immediately reapply the current search and show its related posts");
      assert(pagePostUrls().every(url => postButton(url)?.querySelector(".postLabels")?.textContent.includes("Custom websites")), "results of a renamed-service search should display its current name");
      setPostSearch("");

      const aboutPost = (await openPost("posts/0001.yaml"))?.closest(".postAccordion");
      aboutPost?.querySelector(".postTitleEditButton")?.click();
      const aboutEditor = await waitFor(() => aboutPost?.querySelector(".postInlineEditor"));
      assert(aboutEditor, "bundled About Me post should have an inline editor");
      if (aboutEditor) {
        aboutEditor.elements.title.value = "About my career";
        aboutEditor.elements.body.value = "Updated on my phone and saved in Firebase.";
        aboutEditor.querySelector('[name="serviceIds"][value="web-site"]').checked = true;
        window.testFailWrites = true;
        aboutEditor.requestSubmit();
        await waitFor(() => aboutEditor.querySelector('[role="status"]').textContent.includes("Unable"));
        assert(aboutEditor.isConnected && aboutEditor.elements.body.value.includes("phone"), "failed post saves should preserve edits");
        assert(!testPosts["imported-0001"], "failed migration should not partially save");
        window.testFailWrites = false;
        aboutEditor.requestSubmit();
        window.dispatchEvent(new CustomEvent("open-related-post", { detail: { url: "firestore:second-editable-test-post" } }));
        await waitFor(() => testPosts["imported-0001"]);
        const savedCard = document.querySelector('.serviceCard[data-service="Custom websites"]');
        savedCard?.querySelector('.servicePostsToggle')?.click();
        const savedLink = await waitFor(() => [...savedCard.querySelectorAll('.servicePostLink')].find(link => link.textContent === "About my career"));
        savedLink?.click();
        await waitFor(() => document.querySelector('.postTitleButton[data-id="imported-0001"]'));
        assert(testPosts["imported-0001"]?.body.includes("phone"), "bundled edits should persist to Firebase Posts");
        assert(testPosts["imported-0001"]?.serviceIds.includes("web-site"), "related services should persist with the post");
        assert(JSON.stringify(testPosts["imported-0001"]?.tags) === JSON.stringify(bundledPosts.find(post => post.url === "posts/0001.yaml")?.tags), "bundled About-post migration should preserve its original topic tags");
        const updatedCard = document.querySelector('.serviceCard[data-service="Custom websites"]');
        assert([...updatedCard.querySelectorAll('.servicePostLink')].some(link => link.textContent === "About my career"), "saving tags should immediately update the service's related posts");
        assert(!document.querySelector('[data-url="posts/0001.yaml"]'), "saved Firebase posts should replace bundled originals");
        const importedTitle = document.querySelector('.postTitleButton[data-id="imported-0001"]');
        if (importedTitle?.getAttribute('aria-expanded') !== 'true') importedTitle?.click();
        const related = await waitFor(() => importedTitle?.closest(".postAccordion").querySelector(".relatedServiceSelect"));
        assert(related, "post reader should offer its related service");
        related?.click();
        assert(document.getElementById("serviceSelectionCount").textContent === "1 service selected", "post service selection should update the shared banner");

        // Simulate a return visit as a public reader with an unpublished override.
        testPosts["imported-0001"].published = false;
        testPosts["imported-0001"].Published = false;
        const { setState } = await import("./assets/js/core/state.js");
        const { destroyPortfolio, initPortfolio } = await import("./assets/js/pages/portfolio.js");
        setState("isAdmin", false);
        destroyPortfolio();
        initPortfolio();
        await waitFor(() => document.getElementById("portfolioStatus").hidden);
        window.dispatchEvent(new CustomEvent("open-related-post", { detail: { url: "firestore:imported-0001" } }));
        window.dispatchEvent(new CustomEvent("open-related-post", { detail: { url: "posts/0001.yaml" } }));
        assert(!document.querySelector('[data-id="imported-0001"]') && !document.querySelector('[data-url="posts/0001.yaml"]'), "unpublished Firebase overrides must not reveal bundled originals on a return visit");
        assert(![...document.querySelectorAll('.servicePostLink')].some(link => link.textContent === "About my career" || link.textContent === "Private draft"), "unpublished posts must disappear from related service lists");
        window.testFailPostReads = true;
        document.getElementById("refreshPostsBtn").click();
        await waitFor(() => updatedCard.querySelector('.servicePosts')?.textContent.includes("could not load"));
        assert(updatedCard.querySelector('.servicePosts')?.textContent.includes("could not load"), "failed reads should show an error instead of an empty related list");
        window.testFailPostReads = false;
        document.getElementById("refreshPostsBtn").click();
        await waitFor(() => updatedCard.querySelector('.servicePostLink'));
        assert([...updatedCard.querySelectorAll('.servicePostLink')].some(link => link.textContent === "Editable test post"), "refreshing should recover related posts after a failed read");
      }

      if (failures.length) {
        document.body.dataset.testStatus = "failed";
        results.textContent = `FAIL (${failures.length})\n\n${failures.map((failure) => `• ${failure}`).join("\n")}`;
      } else {
        document.body.dataset.testStatus = "passed";
        results.textContent = "PASS (all single-page behaviors verified)";
      }
      } else {
        document.getElementById("testResults").hidden = true;
        const mode = new URLSearchParams(location.search).get("manual");
        const selector = mode === "post"
          ? '[data-url="posts/0001.yaml"]'
          : mode === "related" ? '.serviceCard[data-service="Web Site"]'
          : '.serviceEditButton[data-service-id="web-site"]';
        for (let attempt = 0; attempt < 100; attempt += 1) {
          const target = document.querySelector(selector);
          if (target) {
            if (mode === "related") {
              if (!document.getElementById("portfolioStatus").hidden) {
                await new Promise((resolve) => setTimeout(resolve, 50));
                continue;
              }
              const card = document.querySelector('.serviceCard[data-service="Web Site"]');
              card.querySelector('.serviceCardFlip').click();
              card.querySelector('.servicePostsToggle').click();
              document.getElementById("servicesSection").scrollIntoView({block: "start"});
              break;
            }
            (mode === "post" ? target.closest(".postAccordion").querySelector(".postTitleEditButton") : target)?.click();
            break;
          }
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
      }
    </script>
  </body>
</html>
