<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JOERICE.me</title>
<style>
/*
  LLM MAINTENANCE CONTRACT — READ BEFORE EDITING

  This project is intentionally a plaintext terminal portfolio.

  Do not convert the interface into a normal website.
  Do not add cards, panels, grids, app chrome, modal previews, visual dashboards,
  embedded media galleries, buttons inside the terminal output, or rich UI sections.

  The terminal output should remain plain text with optional clickable text links.
  The command line should remain the primary interaction model.

  Safe edits:
  - Add or revise content inside the fs object.
  - Add new paths, sections, guide text, body text, image URL records, and map entries.
  - Add simple commands that print plaintext output.
  - Improve command parsing, autocomplete, accessibility, and bug fixes.

  Unsafe edits:
  - Replacing terminal output with visual layout components.
  - Adding image previews inside the terminal.
  - Adding non-terminal navigation UI.
  - Changing the app into a card/grid/portfolio template.

  If asked to expand this site, expand the content tree and the text areas.
  Preserve the plaintext terminal style.
*/
:root {
  --bg:#0d0d0d;
  --fg:#d4d4d4;
  --muted:#555;
  --panel:#111;
  --bar:#1a1a1a;
  --line:#333;
  --warn:#f48771;
  --link:#4fc1ff;
  --prompt:#4ec9b0;
  --mono:"Cascadia Mono","Cascadia Code","JetBrains Mono","SFMono-Regular","Menlo","Consolas","Liberation Mono",monospace;
  --app-vh:100vh;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:var(--app-vh);
  background:var(--bg);
  color:var(--fg);
  font-family:var(--mono);
  font-variant-ligatures:none;
  text-rendering:geometricPrecision;
  font-size:14px;
  line-height:1.45;
}

.shell-wrap {
  min-height:var(--app-vh);
  display:grid;
  place-items:center;
  padding:18px;
}

.shell {
  width:min(980px,100%);
  height:min(720px,calc(var(--app-vh) - 36px));
  border:1px solid var(--line);
  background:var(--panel);
  display:grid;
  grid-template-rows:auto 1fr;
  box-shadow:4px 4px 0 #222;
}

.bar {
  border-bottom:1px solid var(--line);
  padding:7px 12px;
  background:var(--bar);
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-transform:uppercase;
  font-size:11px;
  color:#777;
  letter-spacing:.08em;
}

.bar-dots {
  display:flex;
  gap:6px;
  cursor:pointer;
}

.bar-dot {
  width:12px;
  height:12px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.1);
}

.bar-dot.red { background:#ff5f57; }
.bar-dot.yel { background:#febc2e; }
.bar-dot.grn { background:#28c840; }

.terminal {
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
}

.screen {
  flex:1;
  padding:14px 14px 4px;
  overflow-y:auto;
  white-space:pre-wrap;
  tab-size:2;
}

.shell-link {
  color:var(--link);
  text-decoration:underline;
  cursor:pointer;
  display:inline;
}

.shell-link:hover { opacity:.8; }

.map-block {
  font-family:var(--mono);
  font-variant-ligatures:none;
  letter-spacing:0;
  white-space:pre-wrap;
}

.input-zone { padding:2px 14px 10px; }

.suggestions {
  display:none;
  max-height:160px;
  overflow-y:auto;
  border:1px solid var(--line);
  margin-bottom:4px;
  background:var(--bar);
  font-family:var(--mono);
  font-variant-ligatures:none;
}

.suggestion {
  display:grid;
  grid-template-columns:160px 1fr;
  gap:10px;
  padding:6px 10px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.suggestion:last-child { border-bottom:0; }
.suggestion.active,
.suggestion:hover {
  background:var(--line);
  color:var(--fg);
}

.suggestion .desc { opacity:.65; }

.input-row {
  display:flex;
  align-items:center;
}

.prompt {
  color:var(--prompt);
  white-space:nowrap;
  flex-shrink:0;
  padding-right:4px;
}

input {
  border:0;
  outline:0;
  background:transparent;
  color:var(--fg);
  font:inherit;
  font-family:var(--mono);
  font-variant-ligatures:none;
  width:100%;
  padding:0;
  caret-color:transparent;
}

.input-text-wrap {
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.input-sizer {
  visibility:hidden;
  position:absolute;
  pointer-events:none;
  white-space:pre;
  font:inherit;
  font-family:var(--mono);
  font-variant-ligatures:none;
  left:0;
}

.cursor-block {
  display:inline-block;
  width:0.6em;
  height:1em;
  background:var(--prompt);
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  animation:blink-cursor 1s step-end infinite;
}

@keyframes blink-cursor {
  0%, 100% { opacity:1; }
  50% { opacity:0; }
}

.dim { color:var(--muted); }
.error { color:var(--warn); }
.cmd-echo {
  color:var(--prompt);
  display:block;
  margin-bottom:10px;
}

@media (max-width:700px) {
  body { font-size:12px; }
  .shell {
    height:calc(var(--app-vh) - 24px);
    box-shadow:2px 2px 0 #222;
  }
  .shell-wrap { padding:10px; }
  .suggestion { grid-template-columns:110px 1fr; }
}
</style>
</head>
<body>
<div class="shell-wrap">
  <main class="shell">
    <header class="bar">

        <span class="bar-dot red"></span>
        <span class="bar-dot yel"></span>

        <form class="input-row" id="inputRow">

</div>

<script>
/*
  LLM MAINTENANCE CONTRACT — READ BEFORE EDITING

  This file is a plaintext terminal portfolio, not a visual portfolio template.

  Keep the UI exactly in the terminal style:
  - Plain text output.
  - Optional inline text links.
  - Command-line navigation.
  - Autocomplete suggestions only.

  Do not add cards, panels, grids, embedded media previews, buttons in terminal output,
  dashboards, app sections, or visual navigation systems.

  When adding content, edit the fs object below:
  - Add new paths like "/Projects/example".
  - Add guide text, body text, items, children, and image URL records.
  - Update mapHTML() only when the content tree changes.

  The goal is for future LLMs to add content, not redesign the interface.
*/

/* PUBLISHING TOGGLE: set ENABLE_LINKS:false to make this command-line only. */
const CONFIG = {
  ENABLE_LINKS: true,
  ENABLE_EXTERNAL_LINKS: true
};

const screen = document.getElementById("screen");
const inputRow = document.getElementById("inputRow");
const commandInput = document.getElementById("commandInput");
const promptEl = document.getElementById("prompt");
const suggestionsEl = document.getElementById("suggestions");
const inputSizer = document.getElementById("inputSizer");
const fakeCursor = document.getElementById("fakeCursor");
const barDots = document.getElementById("barDots");

const state = {
  path: "/",
  selectedSuggestion: 0,
  booting: true,
  bootSkipped: false,
  animating: false,
  skipAnimation: false,
  animationId: 0
};

const fs = {

const ARG_COMMANDS = new Set(["/open","/cat","/cd"]);

const commandMeta = [
  { label:"help", value:"help", desc:"show command menu", aliases:["/help"] },
  { label:"?", value:"?", desc:"show command menu", aliases:["/?"] },
  { label:"clear", value:"clear", desc:"reset terminal home", aliases:["/clear"] },
  { label:"cls", value:"cls", desc:"reset terminal home", aliases:[] },
  { label:"pwd", value:"pwd", desc:"show current location", aliases:["/pwd"] },
  { label:"ls", value:"ls", desc:"show current options", aliases:["/ls"] },
  { label:"cd", value:"cd", desc:"move into a section", aliases:["/cd"] },
  { label:"open", value:"open", desc:"open a section or item", aliases:["/open"] },
  { label:"cat", value:"cat", desc:"read a section or item", aliases:["/cat"] },
  { label:"home", value:"home", desc:"return to root", aliases:["/home"] },
  { label:"back", value:"back", desc:"go up one level", aliases:["/back"] },
  { label:"map", value:"map", desc:"show site structure", aliases:["/map"] },
  { label:"about", value:"about", desc:"open about", aliases:["/about"] },
  { label:"contact", value:"contact", desc:"open contact", aliases:["/contact"] }
];

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function updateCursorPosition() {
  inputSizer.textContent = commandInput.value;
  const maxLeft = commandInput.offsetWidth - (fakeCursor.offsetWidth || 9);
  fakeCursor.style.left = Math.min(inputSizer.offsetWidth, Math.max(0, maxLeft)) + "px";
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function areaHeader(title) {
  const clean = String(title || "AREA").toUpperCase();
  const line = "=".repeat(Math.max(22, clean.length + 8));
  return `${line}\n${clean}\n${line}`;
}

function print(text = "", className = "") {
  const span = document.createElement("span");
  if (className) span.className = className;
  span.textContent = text + "\n";
  screen.appendChild(span);
  screen.scrollTop = screen.scrollHeight;
}

async function animateHTML(html = "", speed = 8) {
  const id = ++state.animationId;
  state.animating = true;
  state.skipAnimation = false;

  const wrap = document.createElement("div");
  screen.appendChild(wrap);

  const temp = document.createElement("div");
  temp.innerHTML = html;
  const plainText = temp.textContent || temp.innerText || "";

  let output = "";

  for (let i = 0; i < plainText.length; i++) {
    if (state.skipAnimation || id !== state.animationId) break;

    output += plainText[i];
    wrap.textContent = output;
    screen.scrollTop = screen.scrollHeight;

    if (plainText[i] === "\n") await sleep(24);
    else await sleep(speed);
  }

  if (id === state.animationId) {
    wrap.innerHTML = html;
    screen.scrollTop = screen.scrollHeight;
    state.animating = false;
    state.skipAnimation = false;
  }
}

function shellLink(label, command) {
  if (!CONFIG.ENABLE_LINKS) return escapeHtml(label);
  return `<span class="shell-link" data-command="${escapeHtml(command)}">${escapeHtml(label)}</span>`;
}

function externalLink(label, url) {
  if (!CONFIG.ENABLE_LINKS || !CONFIG.ENABLE_EXTERNAL_LINKS) {
    return `${escapeHtml(label)}: ${escapeHtml(url)}`;
  }
  return `<span class="shell-link" data-external="${escapeHtml(url)}">${escapeHtml(label)} ↗</span>`;
}

function navLine(index, label, command) {
  const number = String(index + 1).padStart(2, "0");
  return `${number}  ${shellLink(label, command)}\n    command: ${escapeHtml(command)}`;
}

function dashboardHTML() {
  const root = fs["/"];
  const lines = root.children.map((item, index) => navLine(index, item, `open ${item}`)).join("\n\n");

  return `${areaHeader("Home")}

JOERICE.ME
version 0.7.2 plaintext trail

${escapeHtml(root.guide)}

Suggested path:
01 About
02 Projects
03 Skills
04 Posts
05 Contact

Select a path to begin.

${lines}

Useful commands:
${shellLink("help", "help")}     command: help
${shellLink("map", "map")}      command: map
${shellLink("clear", "clear")}    command: clear

`;
}

async function resetHome(animated = true) {
  state.animationId++;
  state.animating = false;
  state.skipAnimation = false;
  state.path = "/";
  updatePrompt();
  suggestionsEl.style.display = "none";
  commandInput.value = "";
  updateCursorPosition();
  screen.textContent = "";
  commandInput.focus();

  if (animated) await animateHTML(dashboardHTML(), 5);
  else {
    const wrap = document.createElement("div");
    wrap.innerHTML = dashboardHTML();
    screen.appendChild(wrap);
  }
}

async function typeLine(text = "", delay = 12, className = "") {
  if (state.bootSkipped) return;

  const span = document.createElement("span");
  if (className) span.className = className;
  screen.appendChild(span);

  for (const char of text) {
    if (state.bootSkipped) return;
    span.textContent += char;
    screen.scrollTop = screen.scrollHeight;
    await sleep(delay);
  }

  span.textContent += "\n";
}

async function loadingLine(label, cycles = 2) {
  if (state.bootSkipped) return;

  const span = document.createElement("span");
  screen.appendChild(span);

  for (let i = 0; i < cycles; i++) {
    if (state.bootSkipped) return;
    span.textContent = `${label}.`;
    await sleep(200);

    if (state.bootSkipped) return;
    span.textContent = `${label}..`;
    await sleep(200);

    if (state.bootSkipped) return;
    span.textContent = `${label}...`;
    await sleep(200);
  }

  span.textContent = `${label}... OK\n`;
}

async function finishBoot(animated = false) {
  state.booting = false;
  state.bootSkipped = true;
  await resetHome(animated);
}

async function boot() {
  await typeLine("JOERICE.ME", 20);
  await typeLine("version 0.7.2 plaintext trail", 10, "dim");
  await sleep(250);
  await loadingLine("mounting /identity");
  await loadingLine("mounting /work");
  await loadingLine("mounting /learning");
  await loadingLine("mounting /projects");
  await loadingLine("mounting /media");
  await loadingLine("loading command index");
  await loadingLine("starting shell");

  if (!state.bootSkipped) await finishBoot(true);
}

function normalizeSlashes(path) {
  return path.replace(/\/+/g, "/").replace(/\/$/, "") || "/";
}

function findPathCaseInsensitive(path) {
  const normalized = normalizeSlashes(path);
  if (fs[normalized]) return normalized;

  const lower = normalized.toLowerCase();
  return Object.keys(fs).find(key => key.toLowerCase() === lower) || normalized;
}

function currentNode() {
  return fs[state.path];
}

function parentPath(path = state.path) {
  if (path === "/") return "/";
  const parts = path.split("/").filter(Boolean);
  parts.pop();
  return "/" + parts.join("/") || "/";
}

function findByLeafName(input) {
  const clean = String(input || "").trim().toLowerCase();
  if (!clean) return null;

  const matches = Object.keys(fs).filter(path => {
    const leaf = path.split("/").filter(Boolean).pop();
    return leaf && leaf.toLowerCase() === clean;
  });

  if (matches.length === 1) return matches[0];
  return null;
}

function resolvePath(input) {
  const cleanInput = String(input || "").trim();

  if (!cleanInput || cleanInput === ".") return state.path;
  if (cleanInput === "/") return "/";
  if (cleanInput.startsWith("/")) return findPathCaseInsensitive(cleanInput);

  if (cleanInput === "..") {
    if (state.path === "/") return "/";
    const parts = state.path.split("/").filter(Boolean);
    parts.pop();
    return "/" + parts.join("/") || "/";
  }

  const rootCandidate = findPathCaseInsensitive(`/${cleanInput}`);
  if (fs[rootCandidate]) return rootCandidate;

  const current = currentNode();
  if (current && current.type === "dir") {
    const localCandidate = findPathCaseInsensitive(`${state.path}/${cleanInput}`);
    if (fs[localCandidate]) return localCandidate;
  }

  const parent = parentPath(state.path);
  if (parent !== "/") {
    const siblingCandidate = findPathCaseInsensitive(`${parent}/${cleanInput}`);
    if (fs[siblingCandidate]) return siblingCandidate;
  }

  const leafCandidate = findByLeafName(cleanInput);
  if (leafCandidate) return leafCandidate;

  return findPathCaseInsensitive(state.path === "/" ? `/${cleanInput}` : `${state.path}/${cleanInput}`);
}

function getCurrentChildren(typeFilter = null) {
  const node = currentNode();
  if (!node || node.type !== "dir") return [];

  let children = node.children.map(name => {
    const path = resolvePath(name);
    const child = fs[path];
    return {
      label:name,
      value:name,
      path,
      type:child?.type || "unknown",
      desc:child?.type === "dir" ? "section" : child?.type || "item"
    };
  });

  if (typeFilter) children = children.filter(x => typeFilter.includes(x.type));
  return children;
}

function getAllOpenable() {
  return Object.keys(fs).filter(path => path !== "/").map(path => {
    const node = fs[path];
    const label = path.split("/").pop();
    return { label, value:path, path, type:node.type, desc:path };
  });
}

function getRootOpenable() {
  return fs["/"].children.map(label => {
    const path = `/${label}`;
    const node = fs[path];
    return { label, value:path, path, type:node?.type || "unknown", desc:"root path" };
  });
}

function getNavigationSuggestions(query) {
  const q = String(query || "").toLowerCase();
  const candidates = [
    { label:"home", value:"home", path:"/", desc:"return to root", mode:"command" },
    { label:"back", value:"back", path:parentPath(state.path), desc:"go up one level", mode:"command" },
    ...getCurrentChildren(),
    ...getRootOpenable(),
    ...getAllOpenable()
  ];

  const seen = new Set();

  return candidates
    .filter(item => {
      const key = `${item.mode || "path"}:${item.path || item.value}`;
      if (seen.has(key)) return false;
      seen.add(key);

      const label = String(item.label || "").toLowerCase();
      const value = String(item.value || "").toLowerCase();
      const path = String(item.path || "").toLowerCase();

      return label.includes(q) || value.includes(q) || path.includes(q);
    })
    .slice(0, 12)
    .map(item => {
      if (item.mode === "command") {
        return { label:item.label, value:item.value, desc:item.desc, mode:"command" };
      }
      return {
        label:item.label,
        value:`open ${item.path}`,
        desc:item.desc || item.path,
        mode:"command"
      };
    });
}

function listCurrentHTML() {
  const node = currentNode();
  if (!node) return "Invalid location.";
  if (node.type !== "dir") return "Nothing to select here.";

  const heading = state.path === "/" ? "SELECT A PATH FROM HOME" : "SELECT ANOTHER PATH";
  const rows = node.children.map((item, index) => navLine(index, item, `open ${resolvePath(item)}`)).join("\n\n");

  return `${areaHeader(node.title || heading)}

${heading}

${escapeHtml(node.guide || "Choose where to go next.")}

${rows}
${relatedLinks(state.path)}`;
}

function renderNodeHTML(path) {
  const node = fs[path];

  if (!node) {
    return `${areaHeader("Not Found")}

${escapeHtml(`Not found: ${path}`)}
${relatedLinks(state.path)}`;
  }

  if (node.type === "dir") {
    state.path = path;
    updatePrompt();
    return listCurrentHTML();
  }

  if (node.type === "list") {
    state.path = path;
    updatePrompt();

    const lines = node.items.map((item, index) => {
      const clean = item.replace(/^▧\s*/, "");
      const possibleLocalPath = resolvePath(clean);
      const possibleMediaPath = `/Media/${clean}`;
      const targetPath = fs[possibleLocalPath] ? possibleLocalPath : fs[possibleMediaPath] ? possibleMediaPath : null;

      if (targetPath) return navLine(index, item, `open ${targetPath}`);

      const number = String(index + 1).padStart(2, "0");
      return `${number}  ${escapeHtml(item)}`;
    }).join("\n\n");

    return `${areaHeader(node.title)}

${escapeHtml(node.guide || "Choose where to go next.")}

${lines}
${relatedLinks(path)}`;
  }

  if (node.type === "image") {
    state.path = path;
    updatePrompt();

    return `${areaHeader(node.title)}

${escapeHtml(node.body)}

source:
${escapeHtml(node.url)}

${externalLink("open image in new tab", node.url)}
${relatedLinks(path)}`;
  }

  state.path = path;
  updatePrompt();

  return `${areaHeader(node.title)}

${escapeHtml(node.body)}
${relatedLinks(path)}`;
}

function relatedLinks(path) {
  const parent = parentPath(path);
  const links = [];

  if (path !== "/" && parent !== path && fs[parent]) {
    links.push(`${shellLink("Back", `open ${parent}`)}     command: open ${parent}`);
  }

  links.push(`${shellLink("Home", "home")}     command: home`);

  return `

NEXT:
${links.join("\n")}`;
}

function updatePrompt() {
  promptEl.textContent = `joe@home:${state.path}$`;
}

To publish as command-line only:

}

function canonicalCommand(raw = "") {
  const key = String(raw).trim().toLowerCase().replace(/^\/+/ , "");
  const aliases = {
    "?":"/?",
    help:"/help",
    clear:"/clear",
    cls:"/clear",
    pwd:"/pwd",
    ls:"/ls",
    cd:"/cd",
    open:"/open",
    cat:"/cat",
    home:"/home",
    back:"/back",
    map:"/map",
    about:"/about",
    contact:"/contact"
  };
  return aliases[key] || key;
}

function commandNeedsArgument(line = "") {
  const parts = String(line).trim().split(/\s+/).filter(Boolean);
  return parts.length === 1 && ARG_COMMANDS.has(canonicalCommand(parts[0]));
}

function commandDisplayName(rawCmd, canonical) {
  return String(rawCmd || "").startsWith("/") ? canonical : canonical.replace("/", "");
}

function getSuggestions(value) {
  const raw = String(value || "");
  const trimmed = raw.trim();
  const hasTrailingSpace = /\s$/.test(raw);

  if (!trimmed) return [];

  const parts = trimmed.split(/\s+/);
  const rawCmd = parts[0];
  const cmd = canonicalCommand(rawCmd);
  const arg = hasTrailingSpace && parts.length === 1 ? "" : parts.slice(1).join(" ").toLowerCase();

  if (parts.length === 1 && !hasTrailingSpace && !ARG_COMMANDS.has(cmd)) {
    const query = rawCmd.toLowerCase().replace(/^\/+/ , "");
    const commandSuggestions = commandMeta
      .filter(x => {
        const label = x.label.toLowerCase();
        const slashLabel = `/${label}`;
        const aliases = (x.aliases || []).map(a => a.toLowerCase());
        return label.startsWith(query) || slashLabel.startsWith(rawCmd.toLowerCase()) || aliases.some(a => a.startsWith(rawCmd.toLowerCase()));
      })
      .map(x => ({ label:x.label, value:x.value, desc:x.desc, mode:"command" }));

    const navSuggestions = getNavigationSuggestions(query);
    const seen = new Set();
    return [...commandSuggestions, ...navSuggestions].filter(item => {
      const key = item.value;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0, 12);
  }

  if (cmd === "/cd") {
    const dirs = [
      { label:"..", value:"..", desc:"previous level", mode:"arg" },
      { label:"/", value:"/", desc:"home", mode:"arg" },
      ...getCurrentChildren(["dir"])
    ];

    return dirs
      .filter(x => x.label.toLowerCase().includes(arg) || x.value.toLowerCase().includes(arg))
      .map(x => ({ ...x, mode:"arg", command:commandDisplayName(rawCmd, cmd) }));
  }

  if (cmd === "/open" || cmd === "/cat") {
    const openable = [...getCurrentChildren(), ...getRootOpenable(), ...getAllOpenable()];
    const seen = new Set();

    return openable
      .filter(x => {
        if (seen.has(x.path)) return false;
        seen.add(x.path);
        return x.label.toLowerCase().includes(arg) || x.path.toLowerCase().includes(arg);
      })
      .slice(0, 12)
      .map(x => ({ ...x, mode:"arg", command:commandDisplayName(rawCmd, cmd) }));
  }

  return [];
}

function showSuggestions() {
  const suggestions = getSuggestions(commandInput.value);
  state.selectedSuggestion = Math.min(state.selectedSuggestion, Math.max(suggestions.length - 1, 0));

  if (!suggestions.length) {
    suggestionsEl.style.display = "none";
    suggestionsEl.innerHTML = "";
    return;
  }

  suggestionsEl.style.display = "block";
  suggestionsEl.innerHTML = suggestions.map((item, index) => `
    <div class="suggestion ${index === state.selectedSuggestion ? "active" : ""}" data-index="${index}">
      <div>${escapeHtml(item.label)}</div>
      <div class="desc">${escapeHtml(item.desc || "")}</div>
    </div>
  `).join("");
}

function acceptSuggestion() {
  const suggestions = getSuggestions(commandInput.value);
  const selected = suggestions[state.selectedSuggestion];
  if (!selected) return null;

  if (selected.mode === "command") return selected.value;
  return `${selected.command} ${selected.value}`;
}

async function run(raw, echo = true) {
  const input = String(raw || "").trim();
  if (!input) return;

  if (state.animating) {
    state.skipAnimation = true;
    state.animationId++;
    state.animating = false;
  }

  if (echo) print(`joe@home:${state.path}$ ${input}\n`, "cmd-echo");

  const [rawCmd, ...args] = input.split(/\s+/);
  const cmd = canonicalCommand(rawCmd);
  const arg = args.join(" ");

  if (cmd === "/help" || cmd === "/?") await animateHTML(helpHTML());
  else if (cmd === "/clear") await resetHome(true);
  else if (cmd === "/pwd") await animateHTML(escapeHtml(state.path));
  else if (cmd === "/ls") await animateHTML(listCurrentHTML());
  else if (cmd === "/home") await resetHome(true);
  else if (cmd === "/back") await animateHTML(renderNodeHTML(parentPath(state.path)));
  else if (cmd === "/map") await animateHTML(mapHTML());
  else if (cmd === "/about") await animateHTML(renderNodeHTML("/About"));
  else if (cmd === "/contact") await animateHTML(renderNodeHTML("/Contact"));
  else if (cmd === "/cd") {
    if (!arg) return print("Usage: cd [section]", "error");
    const targetPath = resolvePath(arg);
    const target = fs[targetPath];
    if (!target) return print(`Section not found: ${arg}`, "error");
    if (target.type !== "dir") return print(`Cannot move into: ${arg}`, "error");
    await animateHTML(renderNodeHTML(targetPath));
  }
  else if (cmd === "/open" || cmd === "/cat") {
    if (!arg) return print(`Usage: ${rawCmd} [item]`, "error");
    await animateHTML(renderNodeHTML(resolvePath(arg)));
  }
  else {
    const targetPath = resolvePath(input);
    if (fs[targetPath]) await animateHTML(renderNodeHTML(targetPath));
    else print(`Unknown command or path: ${rawCmd}\nType help or ?`, "error");
  }

  suggestionsEl.style.display = "none";
}

inputRow.addEventListener("submit", e => {
  e.preventDefault();

  if (state.animating) {
    state.skipAnimation = true;
    return;
  }

  const suggestions = getSuggestions(commandInput.value);
  const completed = suggestions.length ? acceptSuggestion() : commandInput.value.trim();

  if (!completed) return;

  commandInput.value = "";
  suggestionsEl.style.display = "none";
  updateCursorPosition();

  if (commandNeedsArgument(completed)) {
    commandInput.value = completed + " ";
    updateCursorPosition();
    showSuggestions();
    return;
  }

  run(completed);
});

commandInput.addEventListener("input", () => {
  if (state.booting) finishBoot(false);
  state.selectedSuggestion = 0;
  showSuggestions();
  updateCursorPosition();
});

commandInput.addEventListener("keydown", e => {
  if (state.booting) finishBoot(false);

  const suggestions = getSuggestions(commandInput.value);

  if (e.key === "ArrowDown" && suggestions.length) {
    e.preventDefault();
    state.selectedSuggestion = (state.selectedSuggestion + 1) % suggestions.length;
    showSuggestions();
  }

  if (e.key === "ArrowUp" && suggestions.length) {
    e.preventDefault();
    state.selectedSuggestion = (state.selectedSuggestion - 1 + suggestions.length) % suggestions.length;
    showSuggestions();
  }

  if (e.key === "Tab" && suggestions.length) {
    e.preventDefault();
    const completed = acceptSuggestion();
    if (completed) {
      commandInput.value = completed + (commandNeedsArgument(completed) ? " " : "");
      updateCursorPosition();
      showSuggestions();
    }
  }
});

screen.addEventListener("click", e => {
  if (!CONFIG.ENABLE_LINKS) return;

  const external = e.target.closest("[data-external]");
  if (external) {
    e.preventDefault();
    window.open(external.dataset.external, "_blank", "noopener,noreferrer");
    return;
  }

  const link = e.target.closest("[data-command]");

  if (state.booting) {
    finishBoot(false);
    return;
  }

  if (state.animating && !link) {
    state.skipAnimation = true;
    return;
  }

  if (!link) return;

  e.preventDefault();
  run(link.dataset.command, true);
});

screen.addEventListener("touchstart", e => {
  if (!CONFIG.ENABLE_LINKS) return;

  const link = e.target.closest("[data-command], [data-external]");
  if (link) return;

  if (state.booting) finishBoot(false);
  else if (state.animating) state.skipAnimation = true;
}, { passive:true });

suggestionsEl.addEventListener("mousedown", e => {
  const item = e.target.closest(".suggestion");
  if (!item) return;

  e.preventDefault();

  state.selectedSuggestion = Number(item.dataset.index);
  const completed = acceptSuggestion();
  if (!completed) return;

  if (commandNeedsArgument(completed)) {
    commandInput.value = completed + " ";
    updateCursorPosition();
    showSuggestions();
  } else {
    commandInput.value = "";
    updateCursorPosition();
    suggestionsEl.style.display = "none";
    run(completed);
  }

  commandInput.focus();
});

barDots.addEventListener("click", () => resetHome(true));

// Redirect printable keypresses to the input so the user can always type
document.addEventListener("keydown", e => {
  if (document.activeElement !== commandInput && !e.ctrlKey && !e.metaKey && !e.altKey &&
      (e.key.length === 1 || e.key === "Backspace" || e.key === "Delete")) {
    commandInput.focus();
  }
});

// Refocus input on any click outside interactive elements
document.addEventListener("click", e => {
  const interactive = e.target.closest("[data-command],[data-external],a,button,.suggestion,.bar-dot,input,textarea");
  if (!interactive) commandInput.focus();
});

updateCursorPosition();

function tickClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}

setInterval(tickClock, 1000);
tickClock();

let viewportSyncRaf = null;

function syncViewportHeight() {
  const viewportHeight = window.visualViewport?.height || document.documentElement.clientHeight;
  document.documentElement.style.setProperty("--app-vh", `${viewportHeight}px`);
}

function scheduleViewportSync() {
  if (viewportSyncRaf !== null) return;
  viewportSyncRaf = requestAnimationFrame(() => {
    viewportSyncRaf = null;
    syncViewportHeight();
  });
}

window.addEventListener("resize", scheduleViewportSync);
window.addEventListener("orientationchange", scheduleViewportSync);
window.visualViewport?.addEventListener("resize", scheduleViewportSync);
syncViewportHeight();
boot();
</script>
