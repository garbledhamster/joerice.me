    }

    if (isTableStart(lines, index)) {
      const table = renderAsciiTable(lines, index);
      output.push(table.html);
      index = table.nextIndex - 1;
      continue;
    }

    if (!trimmed) {

    }

    const heading = /^(#{1,6})\s+(.+)$/.exec(line);
    if (heading) {
      const text = stripInlineMarkdown(heading[2]).toUpperCase();
      output.push(`<span class="md-heading">${escapeHtml(text)}</span>`);

    if (/^\s*[-*]\s+/.test(line)) {
      const item = line.replace(/^\s*[-*]\s+/, "");
      output.push(`<span class="md-list-marker">-</span> ${renderInlineMarkdown(item)}`);

    }

    const orderedItem = /^(\s*)(\d+)\.\s+(.+)$/.exec(line);
    if (orderedItem) {
      output.push(`<span class="md-list-marker">${orderedItem[2]}.</span> ${renderInlineMarkdown(orderedItem[3])}`);
      continue;
    }

    if (/^>\s?/.test(line)) {
      output.push(`<span class="md-quote">|</span> ${renderInlineMarkdown(line.replace(/^>\s?/, ""))}`);
      continue;
    }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      output.push(`<span class="md-heading-rule">${"-".repeat(32)}</span>`);
      continue;
    }

    output.push(renderInlineMarkdown(line));

  if (inCode) output.push(renderCodeBlock(codeLines, codeLanguage));

function findPathCaseInsensitive(path) {
  const normalized = normalizeSlashes(path);
  if (fs[normalized]) return normalized;

  const lower = normalized.toLowerCase();
  return Object.keys(fs).find(key => key.toLowerCase() === lower) || normalized;

function parentPath(path = state.path) {
  if (path === "/") return "/";

  return "/" + parts.join("/") || "/";
}

function findByLeafName(input) {
  const clean = String(input || "").trim().toLowerCase();
  if (!clean) return null;

  const matches = Object.keys(fs).filter(path => {
    const leaf = path.split("/").filter(Boolean).pop();
    return leaf && leaf.toLowerCase() === clean;
  });

  if (matches.length === 1) return matches[0];
  return null;
}

function resolvePath(input) {
  const cleanInput = String(input || "").trim();

  if (!cleanInput || cleanInput === ".") return state.path;
  if (cleanInput === "/") return "/";
  if (cleanInput.startsWith("/")) return findPathCaseInsensitive(cleanInput);

  if (cleanInput === "..") {
    if (state.path === "/") return "/";
    const parts = state.path.split("/").filter(Boolean);
    parts.pop();
    return "/" + parts.join("/") || "/";
  }

  const rootCandidate = findPathCaseInsensitive(`/${cleanInput}`);
  if (fs[rootCandidate]) return rootCandidate;

  const current = currentNode();
  if (current && current.type === "dir") {
    const localCandidate = findPathCaseInsensitive(`${state.path}/${cleanInput}`);
    if (fs[localCandidate]) return localCandidate;
  }

  const parent = parentPath(state.path);
  if (parent !== "/") {
    const siblingCandidate = findPathCaseInsensitive(`${parent}/${cleanInput}`);
    if (fs[siblingCandidate]) return siblingCandidate;
  }

  const leafCandidate = findByLeafName(cleanInput);
  if (leafCandidate) return leafCandidate;

  return findPathCaseInsensitive(state.path === "/" ? `/${cleanInput}` : `${state.path}/${cleanInput}`);
}

function getContactSuggestions(value) {
  const q = String(value || "").trim().toLowerCase();

  if (state.contactPrompt.step === "reason") {
    return CONTACT_REASONS
      .filter(item => {
        const haystack = [item.label, item.value, item.desc, ...(item.aliases || [])].join(" ").toLowerCase();
        return !q || haystack.includes(q);
      })
      .map(item => ({ ...item, mode:"contact" }));
  }

  if (state.contactPrompt.step === "confirm") {
    return CONTACT_CONFIRM_OPTIONS
      .filter(item => item.label.startsWith(q) || item.value.startsWith(q))
      .map(item => ({ ...item, mode:"contact" }));
  }

  return [];
}

function findContactReason(value) {
  const q = String(value || "").trim().toLowerCase();
  return CONTACT_REASONS.find(item => {
    return item.value === q ||
      item.label.toLowerCase() === q ||
      (item.aliases || []).some(alias => alias.toLowerCase() === q);

}

    prompt.step = "message";

send this message?
